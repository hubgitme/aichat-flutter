name: Build Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android platform
        run: |
          flutter create --platforms=android --project-name aichat --org com.hubgitme /tmp/scaffold
          cp -r /tmp/scaffold/android .
          sed -i 's/android:label="[^"]*"/android:label="ای‌چت"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          # Launcher icon from the web version (android-icon/ in the repo; PNGs stored base64)
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            base64 -d "android-icon/mipmap-$d/ic_launcher.png.b64" > "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          base64 -d android-icon/mipmap-xxxhdpi/ic_launcher_foreground.png.b64 > android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          mkdir -p android/app/src/main/res/values
          cp android-icon/res/values/ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_background.xml
          # media_store_plus uses GSON internally: keep it from R8 shrinking
          if [ -f android/app/proguard-rules.pro ]; then
            printf '%s\n' '-keep class com.google.gson.** { *; }' '-keep class com.snnafi.media_store_plus.** { *; }' >> android/app/proguard-rules.pro
          fi
          # WRITE_EXTERNAL_STORAGE (API <=29 only) for the direct-file path of MediaStore saves on old Android
          grep -q 'WRITE_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml || \
            sed -i 's|<application|<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <application|' android/app/src/main/AndroidManifest.xml
            # media_store_plus AAR metadata requires compileSdk 36 (scaffold defaults to 33)
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts 2>/dev/null || true
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle 2>/dev/null || true
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' android/app/build.gradle.kts 2>/dev/null || true

      - name: Get packages
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build release APK (arm64 only)
        run: |
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
          base64 -d keystore/release.p12.b64 > /tmp/release.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          ${BT}zipalign -f -p 4 build/app/outputs/flutter-apk/app-release.apk /tmp/aligned.apk
          ${BT}apksigner sign --ks /tmp/release.p12 --ks-type PKCS12 --ks-pass pass:aichat --key-pass pass:aichat --out aichat-arm64.apk /tmp/aligned.apk
          ${BT}apksigner verify --print-certs aichat-arm64.apk
          ls -lh aichat-arm64.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 aichat-arm64.apk --title "ای‌چت Flutter — نسخه ۱" --notes "نسخه نیتیو Flutter (چت + جست‌وجوی وب + خواندن لینک + تصویر + ویدیو + سینک رمزنگاری‌شده)" || gh release upload v1.0.0 aichat-arm64.apk --clobber
